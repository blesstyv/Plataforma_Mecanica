# Blueprint de Render con plan GRATUITO (sin tarjeta). Base de datos y archivos viven en Supabase (gratis).
# Se crea desde el panel de Render (New > Blueprint); nada se aplica solo.
services:
  - type: web
    name: mecanilab-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 1 --timeout 60 --access-logfile -
    healthCheckPath: /health/
    envVars:
      - { key: PYTHON_VERSION, value: 3.13.5 }
      - { key: DJANGO_SETTINGS_MODULE, value: config.settings.production }
      - { key: DJANGO_SECRET_KEY, generateValue: true }
      - { key: USE_S3, value: "True" }
      # Se escriben solo en el panel de Render (secretos):
      - { key: DATABASE_URL, sync: false }          # Supabase: cadena del "Session pooler"
      - { key: DJANGO_ALLOWED_HOSTS, sync: false }
      - { key: CSRF_TRUSTED_ORIGINS, sync: false }
      - { key: CORS_ALLOWED_ORIGINS, sync: false }
      - { key: S3_BUCKET_NAME, sync: false }
      - { key: S3_ENDPOINT_URL, sync: false }
      - { key: S3_REGION, sync: false }
      - { key: S3_ACCESS_KEY_ID, sync: false }
      - { key: S3_SECRET_ACCESS_KEY, sync: false }
      - { key: DJANGO_TEACHER_USERNAME, sync: false }
      - { key: DJANGO_TEACHER_PASSWORD, sync: false }
